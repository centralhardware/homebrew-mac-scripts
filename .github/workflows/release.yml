name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  pkg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh "${GITHUB_REF_NAME}"
      - run: gh release create "${GITHUB_REF_NAME}" "mac-scripts-${GITHUB_REF_NAME}.pkg" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
