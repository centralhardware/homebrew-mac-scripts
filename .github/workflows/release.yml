name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  pkg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: ./build.sh "${GITHUB_REF_NAME}"
      - run: gh release create "${GITHUB_REF_NAME}" "mac-scripts-${GITHUB_REF_NAME}.pkg" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Bump cask
        run: |
          v="${GITHUB_REF_NAME#v}"
          sha=$(shasum -a 256 "mac-scripts-${GITHUB_REF_NAME}.pkg" | cut -d' ' -f1)
          sed -i '' -e "s/^  version \".*\"/  version \"$v\"/" \
                    -e "s/^  sha256 .*/  sha256 \"$sha\"/" Casks/mac-scripts.rb
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -am "mac-scripts $v"
          git push origin HEAD:main
