name: build
on: pull_request
permissions:
  contents: read
jobs:
  pkg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: plutil -lint LaunchAgents/*.plist LaunchDaemons/*.plist
      - run: ./build.sh v0.0.0
      - name: run-on-logout runs its command on SIGTERM
        run: |
          pkgutil --expand-full mac-scripts-v0.0.0.pkg out
          bin=$(find out -name run-on-logout -type f)
          "$bin" nobody /usr/bin/touch wrong-user   # other users: exits 0 at once
          "$bin" "$(id -un)" /usr/bin/touch marker & pid=$!
          sleep 5; test ! -e marker
          kill -TERM $pid; wait $pid || true
          test -e marker; test ! -e wrong-user
